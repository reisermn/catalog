[tool.poetry]
name = "abco-catalog"
version = "0.1.0"
description = "ABCO product catalog rebuild — catalog-driven TDS enrichment pipeline for chemicals, supplies, and equipment"
authors = ["Matt Reiser"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11"
anthropic = "*"      # Claude API client
rapidfuzz = "*"      # Fuzzy string matching for catalog -> TDS matching
pdfplumber = "*"     # PDF text extraction (for cheap fuzzy matching only)
python-dotenv = "*"  # Loads ANTHROPIC_API_KEY from .env

[tool.poetry.group.dev.dependencies]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
